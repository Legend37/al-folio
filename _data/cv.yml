    Projects:
      - name: "FinAgent OS: Multi-Agent Wealth Management System"
        start_date: 2026-05
        end_date: 2026-06
        summary: Group project for the Software Engineering course
        highlights:
          - Built a LangGraph- and FastAPI-based multi-agent system for user profiling, asset screening, market timing, critic review, and compliance auditing across 54 instruments in nine asset classes.
          - Implemented Markowitz optimization, risk parity, Monte Carlo simulation, VaR and CVaR, stress testing, backtesting, and performance attribution.
          - Integrated AkShare and yfinance data, persistent SQLite sessions, Docker deployment, and GitHub Actions CI while maintaining a 269-test passing baseline.

      - name: "TASIVE: Transformer-Based Siamese Signature Verification"
        start_date: 2025-11
        end_date: 2026-01
        summary: Lead developer; major project for the Deep Learning course
        highlights:
          - Developed a Swin-T Siamese network with a lightweight MLP projection head, L2-normalized 128-dimensional embeddings, and a scaled cosine binary-cross-entropy objective.
          - Designed a strict writer-disjoint train and validation split and evaluated on a fixed all-pairs validation set of 5,748 signature pairs.
          - Achieved 99.98% accuracy, 1.0000 ROC-AUC, and 0.0000 EER, outperforming a reproduced SigNet baseline under the same protocol.

