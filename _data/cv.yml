    Experience:
      - company: University of California, Santa Barbara
        position: Research Intern — AI Multibit Robust Watermark
        location: Santa Barbara, CA
        start_date: 2026-06
        end_date: present
        summary: "Advisor: Prof. Yuheng Bu; ARR under submission"
        highlights:
          - Developed robust multi-bit text watermarking for content attribution, enabling identifier recovery after paraphrasing without access to the original text or watermark-specific training.
          - Achieved 99.83% watermark-bit injection success and 99.70% exact recovery of 32-bit identifiers in 10,000 resampled trials under the evaluated rewriting protocol.
          - Recovered identifiers from all 20 evaluated Wikipedia and arXiv documents after rewriting at a target code rate of 0.2.

      - company: Tsinghua University, College of AI
        position: Undergraduate Researcher — Defense Against Prompt Injection in LLM Agents
        location: Beijing, China
        start_date: 2026-02
        end_date: present
        summary: "First author; advisor: Prof. Yinpeng Dong"
        highlights:
          - Proposed a non-intrusive inference-time defense for indirect prompt injection by detecting intent drift around tool calls and tool responses.
          - Built a Qwen3-8B tool-calling agent pipeline with hooks over the final four transformer layers, paired clean and injected trajectories, contrastive probes, and automatic attack-success labeling.
          - Constructed a 1,220-task benchmark and a 4,000-case cross-domain suite spanning ten application domains.
          - Automated injection generation and genetic search over a 3,072-configuration strategy space; research in progress.

      - company: Tencent Xuanwu Lab
        position: Research Intern — LLM Agent Security
        location: Remote
        start_date: 2026-02
        end_date: 2026-05
        highlights:
          - Explored early defense ideas and used Tencent-provided compute resources to support large-scale experiments for the Tsinghua-led project.

      - company: Tsinghua University, Department of Computer Science and Technology
        position: AI4Science Research Assistant — Crystal-Structure LLM Post-Training
        location: Beijing, China
        start_date: 2025-08
        end_date: 2026-02
        summary: "Advisor: Prof. Yang Liu"
        highlights:
          - Contributed to a three-stage LLM post-training workflow covering scientific-data preparation, supervised fine-tuning, and reinforcement-learning-based optimization.
          - Collected and cleaned crystal-structure data and aligned prompts, model inputs, and target outputs for training and evaluation.
          - Designed reasoning-oriented reward functions and explored reward shaping and prompt-alignment strategies.

